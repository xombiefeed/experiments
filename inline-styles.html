<!DOCTYPE html>
<html>
    <head>
        <title>Inline styles</title>
    </head>
    <body>
        <h1 style="background-color: green; font-size: 30px; color: red">
            Heading <span style="color: blue;">One</span> 
        </h1>
        <h2 style="background-color: darkgoldenrod; font-size:30px; color: aquamarine">Heading 2</h2>
        <h3 style="background-color: green; font-size:30px; color: crimson">Heading 3</h3>
        <h4 style="background-color: darkgoldenrod; font-size:30px; color: darkblue">Heading 4</h4>
        <h1 style="background-color: darkgoldenrod; font-size:20px; color: indigo">Heading 1</h1>
        <h2 style="background-color: darkgoldenrod; font-size:20px; color: yellowgreen">Heading 2</h2>
        <h3 style="background-color: green; font-size:20px; color: lightcoral">Heading 3</h3>
        <h4 style="background-color: darkgoldenrod; font-size:20px; color: lightseagreen">Heading 4</h4>
    </body>
</html>
